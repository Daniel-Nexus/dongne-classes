[project]
name = "dongne-classes"
version = "0.0.1"
description = "송파구 어린이 강좌 통합 검색 (MVP)"
requires-python = ">=3.10"
dependencies = [
    "scrapling[fetchers]>=0.4,<0.5",
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
